<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #161b22; border: 1px solid #f85149; border-radius: 12px; padding: 2rem; max-width: 500px; text-align: center; }
        h2 { color: #f85149; margin-bottom: 1rem; }
        p { color: #8b949e; margin-bottom: 1.5rem; }
        a { color: #6366f1; text-decoration: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>Something went wrong</h2>
    <p th:text="${errorMessage}">Error message here</p>
    <a href="/events">Go back to Events</a>
</div>
</body>
</html>
