<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; }
        nav { background: #161b22; border-bottom: 1px solid #30363d; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { color: #6366f1; font-size: 1.2rem; font-weight: bold; }
        nav a { color: #8b949e; text-decoration: none; margin-left: 1rem; }
        nav a:hover { color: #e6edf3; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 2rem; }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: #6366f1; display: flex; align-items: center;
            justify-content: center; font-size: 2rem; font-weight: bold;
            margin: 0 auto 1.5rem; color: white;
        }
        h2 { text-align: center; font-size: 1.3rem; margin-bottom: 0.3rem; }
        .role { text-align: center; color: #6366f1; font-size: 0.85rem; margin-bottom: 1.5rem; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .info-item { background: #0d1117; border-radius: 8px; padding: 0.8rem 1rem; }
        .info-item label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 0.3rem; }
        .info-item span { font-size: 0.95rem; color: #e6edf3; }
        .btn-row { display: flex; gap: 1rem; margin-top: 1.5rem; }
        .btn { flex: 1; padding: 0.6rem; text-align: center; border-radius: 8px; text-decoration: none; font-size: 0.9rem; transition: background 0.2s; }
        .btn-primary { background: #6366f1; color: white; border: none; cursor: pointer; }
        .btn-primary:hover { background: #4f46e5; }
        .btn-secondary { background: transparent; color: #8b949e; border: 1px solid #30363d; }
        .btn-secondary:hover { color: #e6edf3; border-color: #6366f1; }
    </style>
</head>
<body>
<nav>
    <span class="logo">Campus Events</span>
    <div>
        <a th:href="@{/events}">Events</a>
        <a th:href="@{/my-events}">My Events</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</nav>
<div class="container">
    <div class="card">
        <div class="avatar" th:text="${user != null ? user.name.substring(0,1).toUpperCase() : 'S'}"></div>
        <h2 th:text="${user != null ? user.name : 'Student'}"></h2>
        <div class="role">Student</div>
        <div class="info-grid">
            <div class="info-item">
                <label>Email</label>
                <span th:text="${user != null ? user.email : 'N/A'}"></span>
            </div>
            <div class="info-item">
                <label>Phone</label>
                <span th:text="${user != null and user.phone != null ? user.phone : 'N/A'}"></span>
            </div>
            <div class="info-item">
                <label>Department</label>
                <span th:text="${user != null and user.department != null ? user.department : 'N/A'}"></span>
            </div>
            <div class="info-item">
                <label>Year of Study</label>
                <span th:text="${user != null and user.yearOfStudy != null ? user.yearOfStudy : 'N/A'}"></span>
            </div>
        </div>
        <div class="btn-row">
            <a class="btn btn-secondary" th:href="@{/events}">Browse Events</a>
            <a class="btn btn-secondary" th:href="@{/my-events}">My Events</a>
        </div>
    </div>
</div>
</body>
</html>
